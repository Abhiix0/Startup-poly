name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_BIN: supabase
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start local Supabase
        run: supabase start

      - name: Set environment variables from Supabase
        run: |
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=$(supabase status | grep 'anon key' | cut -d':' -f2- | xargs)" >> $GITHUB_ENV

      - name: Reset database from migrations
        run: supabase db reset

      - name: pgTAP tests
        run: supabase test db

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Bundle secret scan
        run: npm run check:bundle

      - name: Database suites (races, security over HTTP, RPC contract)
        shell: bash
        run: |
          set +e
          npm run test:db-suites 2>&1 | tee dbsuites.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            grep -E "FAILED|FAIL|Error:|AssertionError" dbsuites.log | head -n 25 | while IFS= read -r line; do
              echo "::error title=DB-Suites::$line"
            done
            FAILS=$(tail -n 35 dbsuites.log | tr '\n' ' | ')
            echo "::error title=DB-Suites-Tail::$FAILS"
          fi
          exit $EXIT_CODE

      - name: Upgrade path (live 0015 game to latest)
        shell: bash
        run: |
          set +e
          npm run test:upgrade 2>&1 | tee upgrade.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            FAILS=$(tail -n 35 upgrade.log | tr '\n' ' | ')
            echo "::error title=Upgrade-Tail::$FAILS"
          fi
          exit $EXIT_CODE
