name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_BIN: supabase
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start local Supabase
        run: supabase start

      - name: Set environment variables from Supabase
        run: |
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=$(supabase status | grep 'anon key' | cut -d':' -f2- | xargs)" >> $GITHUB_ENV

      - name: Reset database from migrations
        run: supabase db reset

      - name: pgTAP tests
        shell: bash
        run: |
          set +e
          supabase test db 2>&1 | tee pgtap.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            FAILS=$(grep -E "^not ok|Looks like|ERROR:" pgtap.log | head -n 20 | tr '\n' ' | ')
            echo "::error title=pgTAP-Failures::$FAILS"
            TAIL=$(tail -n 25 pgtap.log | tr '\n' ' | ')
            echo "::error title=pgTAP-Tail::$TAIL"
          fi
          exit $EXIT_CODE

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Bundle secret scan
        run: npm run check:bundle

      - name: Database suites (races, security over HTTP, RPC contract)
        run: npm run test:db-suites

      - name: Upgrade path (live 0015 game to latest)
        run: npm run test:upgrade
